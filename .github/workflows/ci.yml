# CI de Pedidos Web (taller U6): build y test en cada push y pull request.
# Permisos mínimos, sin secretos. El proyecto vive en una subcarpeta del repo.
name: CI

on:
  push:
    paths:
      - 'unidad-6/taller/pedidos-web/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'unidad-6/taller/pedidos-web/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: unidad-6/taller/pedidos-web
    steps:
      # Versiones fijas por tag exacto (SHA entre paréntesis, por si se quiere fijar por SHA)
      - uses: actions/checkout@v7.0.1          # 3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@v6.1.0      # 0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.403'
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
